name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cd messenger_app
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath ../build/ios CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          cd ..
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r ../PulseChat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PulseChat-IPA
          path: PulseChat.ipa
